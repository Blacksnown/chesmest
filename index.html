<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Chúc Mừng Năm Mới 2026 - AE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Lexend:wght@300;600&display=swap");

      body {
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: "Lexend", sans-serif;
        touch-action: none;
      }

      canvas {
        display: block;
      }

      .ui-content {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        z-index: 10;
        pointer-events: none;
        padding: 20px;
      }

      .year-label {
        color: #ff3e3e;
        font-weight: 700;
        letter-spacing: 4px;
        margin-bottom: 0.5rem;
        text-shadow: 0 0 10px rgba(255, 62, 62, 0.5);
        font-size: 0.9rem;
      }

      .main-title {
        font-family: "Montserrat", sans-serif;
        font-size: clamp(2.2rem, 10vw, 4.5rem);
        font-weight: 900;
        line-height: 1.1;
        margin-bottom: 25vh; /* Tạo khoảng trống cho hình con ngựa ở giữa */
        background: linear-gradient(to bottom, #fff, #ffd700, #ff8c00);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-transform: uppercase;
      }

      .wish-box {
        position: absolute;
        bottom: 15%;
        width: 85%;
        max-width: 500px;
        background: rgba(0, 0, 0, 0.5);
        border-bottom: 2px solid #ffd700;
        padding: 15px 20px;
        backdrop-filter: blur(8px);
        opacity: 0;
        transform: translateY(20px);
        transition: all 0.8s ease;
      }

      .wish-text {
        color: #fff;
        font-size: 1.1rem;
        font-weight: 500;
        line-height: 1.5;
        text-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
      }

      /* Hiệu ứng tia sáng vàng rực rỡ phía sau */
      .bg-glow {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100vw;
        height: 100vw;
        background: radial-gradient(
          circle,
          rgba(255, 215, 0, 0.15) 0%,
          rgba(0, 0, 0, 0) 70%
        );
        z-index: 1;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="bg-glow"></div>

    <div class="ui-content">
      <div class="year-label uppercase">Năm Bính Ngọ 2026</div>
      <h1 class="main-title">CHÚC MỪNG<br />NĂM MỚI</h1>

      <div id="wish-box" class="wish-box">
        <p id="wish-text" class="wish-text"></p>
      </div>
    </div>

    <script>
      const wishes = [
        "Chúc ae 2026 rực rỡ, thi đâu đậu đó, thẳng tiến nguyện vọng 1!",
        "Năm mới Bính Ngọ, chúc ae sức khỏe vô biên, tinh thần thép, vượt mọi kỳ thi.",
        "Chúc ae gặt hái thành tựu vang dội, khẳng định bản thân trong năm 2026!",
        "Sức khỏe dồi dào, trí tuệ minh mẫn, mọi dự định của ae đều thành hiện thực!",
        "Vững vàng tâm lý, đỗ ngay NV1 - Chúc ae một năm mới bùng nổ thành công!",
      ];

      let wishIdx = 0;
      const wishBox = document.getElementById("wish-box");
      const wishText = document.getElementById("wish-text");

      function nextWish() {
        wishBox.style.opacity = "0";
        wishBox.style.transform = "translateY(10px)";
        setTimeout(() => {
          wishText.innerText = wishes[wishIdx];
          wishBox.style.opacity = "1";
          wishBox.style.transform = "translateY(0)";
          wishIdx = (wishIdx + 1) % wishes.length;
        }, 800);
      }

      // --- Ma trận điểm hình ngựa Rear (Hùng vĩ như trong ảnh) ---
      // Tọa độ đã được tinh chỉnh để giống hệt tư thế ngựa tung vó
      const horsePoints = [
        // Đầu & Tai
        { x: 0.6, y: 3.2 },
        { x: 0.7, y: 3.5 },
        { x: 0.9, y: 3.3 },
        { x: 1.1, y: 2.8 },
        { x: 0.9, y: 2.6 },
        // Mõm
        { x: 1.3, y: 2.7 },
        { x: 1.4, y: 2.4 },
        { x: 1.1, y: 2.3 },
        // Cổ (uốn cong hùng vĩ)
        { x: 0.4, y: 2.4 },
        { x: 0.2, y: 2.0 },
        { x: 0.0, y: 1.6 },
        { x: -0.2, y: 1.2 },
        // Bờm ngựa (tỏa ra)
        { x: 0.3, y: 3.0 },
        { x: 0.1, y: 2.7 },
        { x: -0.1, y: 2.3 },
        { x: -0.3, y: 1.8 },
        { x: -0.4, y: 1.3 },
        // Ngực
        { x: -0.5, y: 0.8 },
        { x: -0.8, y: 0.4 },
        { x: -0.4, y: 0.2 },
        // Chân trước 1 (Co lên cao)
        { x: 0.2, y: 0.5 },
        { x: 0.6, y: 0.3 },
        { x: 1.0, y: 0.4 },
        { x: 1.1, y: 0.1 },
        // Chân trước 2 (Co gập)
        { x: 0.0, y: 0.0 },
        { x: 0.3, y: -0.3 },
        { x: 0.6, y: -0.2 },
        // Lưng (uốn lượn)
        { x: -1.2, y: 1.0 },
        { x: -1.8, y: 1.1 },
        { x: -2.5, y: 0.9 },
        { x: -3.2, y: 0.5 },
        // Thân/Bụng
        { x: -1.5, y: -0.2 },
        { x: -2.2, y: -0.4 },
        { x: -2.8, y: -0.5 },
        // Mông (đầy đặn)
        { x: -3.8, y: 0.2 },
        { x: -4.3, y: -0.3 },
        { x: -4.0, y: -1.0 },
        { x: -3.5, y: -0.4 },
        // Chân sau 1 (Trụ)
        { x: -3.4, y: -1.5 },
        { x: -3.2, y: -2.5 },
        { x: -3.5, y: -3.5 },
        { x: -3.3, y: -4.2 },
        // Chân sau 2 (Trụ)
        { x: -4.2, y: -1.8 },
        { x: -4.5, y: -2.8 },
        { x: -4.3, y: -3.8 },
        { x: -4.6, y: -4.5 },
        // Đuôi (Xòe rộng, uốn cong ra sau)
        { x: -4.6, y: 0.5 },
        { x: -5.3, y: 0.8 },
        { x: -6.0, y: 0.5 },
        { x: -6.3, y: -0.2 },
        { x: -6.0, y: -1.2 },
        { x: -5.5, y: -0.8 },
        { x: -5.0, y: -0.2 },
        // Bổ sung các điểm bên trong để tạo khối (In-fill)
        { x: -1.0, y: 0.5 },
        { x: -2.0, y: 0.3 },
        { x: -3.0, y: 0.0 },
        { x: -0.5, y: 1.5 },
      ];

      let scene, camera, renderer, system;
      const count = 6000; // Tăng lượng hạt để hình con ngựa dày đặc, lấp lánh hơn

      function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(
          70,
          window.innerWidth / window.innerHeight,
          0.1,
          1000,
        );
        camera.position.z = 10;

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const geo = new THREE.BufferGeometry();
        const pos = new Float32Array(count * 3);
        const cols = new Float32Array(count * 3);
        const sizes = new Float32Array(count);

        for (let i = 0; i < count; i++) {
          const i3 = i * 3;
          // Khởi tạo hạt nằm ngay tại các vị trí hình con ngựa
          const basePoint = horsePoints[i % horsePoints.length];

          // Thêm độ lệch ngẫu nhiên nhỏ để tạo độ dày cho thân ngựa
          pos[i3] = basePoint.x * 1.6 + (Math.random() - 0.5) * 0.7;
          pos[i3 + 1] = basePoint.y * 1.6 + (Math.random() - 0.5) * 0.7 - 0.5; // Dịch xuống một chút để cân đối màn hình
          pos[i3 + 2] = (Math.random() - 0.5) * 1.5;

          // Màu vàng kim rực rỡ (Gold)
          cols[i3] = 1.0;
          cols[i3 + 1] = 0.8 + Math.random() * 0.2;
          cols[i3 + 2] = 0.1;

          sizes[i] = Math.random() * 1.5;
        }

        geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
        geo.setAttribute("color", new THREE.BufferAttribute(cols, 3));

        const mat = new THREE.PointsMaterial({
          size: 0.06,
          vertexColors: true,
          transparent: true,
          opacity: 0.9,
          blending: THREE.AdditiveBlending,
        });

        system = new THREE.Points(geo, mat);
        scene.add(system);
      }

      function animate() {
        requestAnimationFrame(animate);

        const positions = system.geometry.attributes.position.array;
        const time = Date.now() * 0.001;

        for (let i = 0; i < count; i++) {
          const i3 = i * 3;
          // Hiệu ứng hạt "thở" - lung linh tại chỗ
          positions[i3] += Math.sin(time + i) * 0.005;
          positions[i3 + 1] += Math.cos(time + i) * 0.005;

          // Hiệu ứng bụi sao rơi nhẹ xung quanh hình ngựa
          if (i % 20 === 0) {
            positions[i3 + 1] -= 0.01;
            if (positions[i3 + 1] < -6) {
              const bp = horsePoints[i % horsePoints.length];
              positions[i3 + 1] = bp.y * 1.6;
            }
          }
        }

        system.geometry.attributes.position.needsUpdate = true;
        // Xoay nhẹ toàn khối để tạo chiều sâu 3D
        system.rotation.y = Math.sin(time * 0.5) * 0.1;

        renderer.render(scene, camera);
      }

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      window.onload = () => {
        init();
        animate();

        // Hiển thị lời chúc đầu tiên ngay lập tức
        setTimeout(() => {
          nextWish();
          setInterval(nextWish, 5000);
        }, 500);
      };
    </script>
  </body>
</html>
